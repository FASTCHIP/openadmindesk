name: CI

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb \
            libgl1 \
            libegl1 \
            libxkbcommon-x11-0 \
            libicu74

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "poetry==2.3.2"
          poetry install --with dev --no-interaction

      - name: Validate lockfile
        run: poetry check --lock

      - name: Lint with ruff
        run: |
          poetry run ruff check src tools tests

      - name: Test with pytest
        run: |
          xvfb-run --auto-servernum poetry run pytest -q --tb=short

      - name: Verify imports
        run: |
          poetry run python -c "
          from openadmindesk.core.rdp_client import RdpCertTrustStore
          from openadmindesk.core.tunnel_manager import TunnelManager
          from openadmindesk.core.settings import AppSettings
          from openadmindesk.ui.tools_hub import ToolsHub
          print('Core imports OK')
          "

  build-check:
    runs-on: ubuntu-24.04
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev rpm
          python -m pip install "poetry==2.3.2"

      - name: Validate lockfile
        run: poetry check --lock

      - name: Build Python packages
        run: |
          poetry build

      - name: Verify package structure

        run: |
          python tools/build.py python-pkg
          ls -la dist/
          echo "Build artifacts:"
          ls dist/
