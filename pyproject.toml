[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openadmindesk"
version = "0.1.3"
description = "Modern open source Linux remote administration workbench"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "GPL-3.0-or-later"
authors = [
    {name = "OpenAdminDesk Contributors"},
]
dependencies = [
    "PySide6>=6.7",
    "cryptography>=42",
    "argon2-cffi>=23",
    "paramiko>=3.4",
    "pyte>=0.8.2",
    "telnetlib3>=4.0",
]

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
pytest-cov = "^5.0"
ruff = "^0.15"
mypy = "^2.3"
bandit = "^1.7"
pip-audit = "^2.10.1"
pyyaml = "^6.0.3"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.15.22",
    "mypy>=2.3.0",
    "bandit>=1.7",
    "pip-audit>=2.7.0",
    "PyYAML>=6.0.3,<7",
]
build = ["PyInstaller>=6.21,<7"]

[project.scripts]
openadmindesk = "openadmindesk.app:main"
openadmindesk-vault-upgrade = "openadmindesk.vault_upgrade_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"
[tool.setuptools.package-data]
openadmindesk = ["locale/*.json"]


[tool.pytest.ini_options]
markers = [
    "qt: tests that construct Qt widgets and require QApplication",
]
